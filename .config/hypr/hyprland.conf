
# #######################################################################################
# AUTOGENERATED HYPRLAND CONFIG.
# EDIT THIS CONFIG ACCORDING TO THE WIKI INSTRUCTIONS.
# #######################################################################################


# This is an example Hyprland config file.
# Refer to the wiki for more information.
# https://wiki.hypr.land/Configuring/

# Please note not all available settings / options are set here.
# For a full list, see the wiki

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf


################
### MONITORS ###
################

# See https://wiki.hypr.land/Configuring/Monitors/
monitor=,preferred,auto,1


###################
### MY PROGRAMS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/

# Set programs that you use
$terminal = kitty
$fileManager = thunar
$menu = fuzzel


#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = $terminal
# exec-once = nm-applet &
exec-once = ags
exec-once = swww-daemon
exec-once = swaync



#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hypr.land/Configuring/Environment-variables/

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24


###################
### PERMISSIONS ###
###################

# See https://wiki.hypr.land/Configuring/Permissions/
# Please note permission changes here require a Hyprland restart and are not applied on-the-fly
# for security reasons

# ecosystem {
#   enforce_permissions = 1
# }

# permission = /usr/(bin|local/bin)/grim, screencopy, allow
# permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
# permission = /usr/(bin|local/bin)/hyprpm, plugin, allow


#####################
### LOOK AND FEEL ###
#####################

source = ~/.config/hypr/colors.conf

# Refer to https://wiki.hypr.land/Configuring/Variables/

# https://wiki.hypr.land/Configuring/Variables/#general
general {
    gaps_in = 5
    gaps_out = 20 

    border_size = 2

    # https://wiki.hypr.land/Configuring/Variables/#variable-types for info about colors
    col.active_border = $primary
    col.inactive_border = rgba(595959aa)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    # Please see https://wiki.hypr.land/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
    rounding = 10
    rounding_power = 2

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # https://wiki.hypr.land/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 3
        passes = 1

        vibrancy = 0.1696
    }
}

# https://wiki.hypr.land/Configuring/Variables/#animations
# Custom fluid elastic animations — spring-like physics for a premium feel
animations {
    enabled = yes, please :)

    # ── Custom Bezier Curves ──────────────────────────────────────
    #        NAME,           X0,    Y0,    X1,    Y1
    bezier = elastic,        0.28,  0.84,  0.42,  1       # Springy ease-out
    bezier = fluentDecel,    0.1,   1,     0,     1       # Super smooth deceleration
    bezier = fluentAccel,    1,     0,     1,     0.5     # Snappy acceleration
    bezier = bounceOut,      0.34,  1.56,  0.64,  1       # Elastic overshoot
    bezier = smoothOut,      0.36,  0,     0.66,  -0.56   # Smooth exit with pullback
    bezier = realSmooth,     0.28,  0.29,  0.1,   1.04    # Natural physical motion
    bezier = linear,         0,     0,     1,     1       # Linear (kept for fades)

    # ── Window Animations ─────────────────────────────────────────
    #           NAME,          ONOFF, SPEED, CURVE,        [STYLE]
    animation = windows,       1,     3.5,   bounceOut
    animation = windowsIn,     1,     3,     bounceOut,    popin 80%
    animation = windowsOut,    1,     2.2,   smoothOut,    popin 85%
    animation = windowsMove,   1,     3,     fluentDecel

    # ── Fade Animations ───────────────────────────────────────────
    animation = fadeIn,        1,     2.5,   fluentDecel
    animation = fadeOut,       1,     2,     fluentDecel
    animation = fade,          1,     3,     fluentDecel
    animation = fadeDim,       1,     3,     fluentDecel
    animation = fadeShadow,    1,     3,     fluentDecel

    # ── Border Animations ─────────────────────────────────────────
    animation = border,        1,     4,     elastic
    animation = borderangle,   1,     50,    linear, loop

    # ── Layer Animations (menus, overlays, popups) ────────────────
    animation = layers,        1,     3,     bounceOut,    fade
    animation = layersIn,      1,     3,     bounceOut,    fade
    animation = layersOut,     1,     1.8,   fluentAccel,  fade
    animation = fadeLayersIn,  1,     2.5,   fluentDecel
    animation = fadeLayersOut, 1,     2,     fluentDecel

    # ── Workspace Animations ──────────────────────────────────────
    animation = workspaces,    1,     3.5,   realSmooth,   slide
    animation = workspacesIn,  1,     3,     realSmooth,   slide
    animation = workspacesOut, 1,     3.5,   realSmooth,   slide
    animation = specialWorkspace, 1,  3,     bounceOut,    slidevert
}

# Ref https://wiki.hypr.land/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrule = bordersize 0, floating:0, onworkspace:w[tv1]
# windowrule = rounding 0, floating:0, onworkspace:w[tv1]
# windowrule = bordersize 0, floating:0, onworkspace:f[1]
# windowrule = rounding 0, floating:0, onworkspace:f[1]

# See https://wiki.hypr.land/Configuring/Dwindle-Layout/ for more
dwindle {
    # pseudotile was removed in Hyprland v0.40+; the dwindle layout no longer
    # has a global pseudotile toggle.
    preserve_split = true # You probably want this
}

# See https://wiki.hypr.land/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hypr.land/Configuring/Variables/#misc
misc {
    force_default_wallpaper = -1 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = false # If true disables the random hyprland logo / anime girl background. :(
}


#############
### INPUT ###
#############

# https://wiki.hypr.land/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = false
    }
}

# See https://wiki.hypr.land/Configuring/Gestures
gesture = 3, horizontal, workspace

# Example per-device config
# See https://wiki.hypr.land/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


###################
### KEYBINDINGS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier


bind = $mainMod SHIFT, S, exec, ~/.config/hypr/screenie.sh
bind = $mainMod SHIFT, P, exec, ~/.config/hypr/screener.sh

# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod, `, exit,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, F, togglefloating,
bind = $mainMod, A, exec, $menu
# bind = $mainMod, P, pseudo, # dwindle — deprecated in Hyprland v0.40+
bind = $mainMod, J, layoutmsg, togglesplit # dwindle
bind = $mainMod, L, exec,wlogout
bind = $mainMod, H, exec,hyprlock

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
# --- Updated style (Switch + Run Script) ---
# Workspace 1-10 Binds (Switch Workspace + Run Wallpaper Script)
# Note: $mainMod should be defined elsewhere (e.g., $mainMod = SUPER)

# -------------------------------------------------------------
# WORKSPACE MANAGEMENT (Uses switch_and_theme.sh wrapper)
# This wrapper handles the workspace change AND the theme update for reliability.
# -------------------------------------------------------------

# Switch to workspace with mainMod + [0-9]
bind = $mainMod, 1, exec, ~/.config/hypr/scripts/switch_and_theme.sh 1
bind = $mainMod, 2, exec, ~/.config/hypr/scripts/switch_and_theme.sh 2
bind = $mainMod, 3, exec, ~/.config/hypr/scripts/switch_and_theme.sh 3
bind = $mainMod, 4, exec, ~/.config/hypr/scripts/switch_and_theme.sh 4
bind = $mainMod, 5, exec, ~/.config/hypr/scripts/switch_and_theme.sh 5
bind = $mainMod, 6, exec, ~/.config/hypr/scripts/switch_and_theme.sh 6
bind = $mainMod, 7, exec, ~/.config/hypr/scripts/switch_and_theme.sh 7
bind = $mainMod, 8, exec, ~/.config/hypr/scripts/switch_and_theme.sh 8
bind = $mainMod, 9, exec, ~/.config/hypr/scripts/switch_and_theme.sh 9
bind = $mainMod, 0, exec, ~/.config/hypr/scripts/switch_and_theme.sh 10

# Move active window to a workspace and switch focus
# Note: We still need the initial movetoworkspace command here.
bind = $mainMod SHIFT, 1, exec, hyprctl dispatch movetoworkspace 1; ~/.config/hypr/scripts/switch_and_theme.sh 1
bind = $mainMod SHIFT, 2, exec, hyprctl dispatch movetoworkspace 2; ~/.config/hypr/scripts/switch_and_theme.sh 2
bind = $mainMod SHIFT, 3, exec, hyprctl dispatch movetoworkspace 3; ~/.config/hypr/scripts/switch_and_theme.sh 3
bind = $mainMod SHIFT, 4, exec, hyprctl dispatch movetoworkspace 4; ~/.config/hypr/scripts/switch_and_theme.sh 4
bind = $mainMod SHIFT, 5, exec, hyprctl dispatch movetoworkspace 5; ~/.config/hypr/scripts/switch_and_theme.sh 5
bind = $mainMod SHIFT, 6, exec, hyprctl dispatch movetoworkspace 6; ~/.config/hypr/scripts/switch_and_theme.sh 6
bind = $mainMod SHIFT, 7, exec, hyprctl dispatch movetoworkspace 7; ~/.config/hypr/scripts/switch_and_theme.sh 7
bind = $mainMod SHIFT, 8, exec, hyprctl dispatch movetoworkspace 8; ~/.config/hypr/scripts/switch_and_theme.sh 8
bind = $mainMod SHIFT, 9, exec, hyprctl dispatch movetoworkspace 9; ~/.config/hypr/scripts/switch_and_theme.sh 9
bind = $mainMod SHIFT, 0, exec, hyprctl dispatch movetoworkspace 10; ~/.config/hypr/scripts/switch_and_theme.sh 10

# Handle Move to Next/Prev Workspace (Mouse Wheel)
bind = $mainMod, mouse_down, exec, ~/.config/hypr/scripts/switch_and_theme.sh e+1
bind = $mainMod, mouse_up, exec, ~/.config/hypr/scripts/switch_and_theme.sh e-1

######
# Keep the rest of your non-workspace binds unchanged:
bind = $mainMod, R, exec, ags -q; ags &
bind = $mainMod, N, exec, swaync-client -t -sw  # Toggle notification center
# Brightness controls
bind = ,XF86MonBrightnessDown,exec,~/.config/hypr/scripts/dimmer.sh
bind = ,XF86MonBrightnessUp,exec,~/.config/hypr/scripts/brighter.sh

# Color temperature controls
bind = ALT,XF86MonBrightnessDown,exec,~/.config/hypr/scripts/warmer.sh
bind = ALT,XF86MonBrightnessUp,exec,~/.config/hypr/scripts/true.sh
bind = SUPER, W, exec, ~/.config/hypr/change-wallpaper.sh

# Example special workspace (scratchpad)
bind = $mainMod, M, togglespecialworkspace, magic
bind = $mainMod SHIFT, M, movetoworkspace, special:magic
bind = $mainMod, Y, layoutmsg, togglesplit
bind = $mainMod, S, exec ,~/.config/hypr/scripts/spotifyapply.sh
# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule
# windowrule = float 1, class:^(kitty)$, title:^(kitty)$

# Ignore maximize requests from apps. You'll probably like this.
#windowrule = suppressevent maximize, class:.*

# Fix some dragging issues with XWayland
#windowrule = nofocus, class:^$, title:^$, xwayland:1, floating:1, fullscreen:0, pinned:0

# qView: Floating, centered, and specific size
windowrule = float 1, class:^(com.interversehq.qView)$
windowrule = size 1600 900, class:^(com.interversehq.qView)$
windowrule = center 1, class:^(com.interversehq.qView)$

# Spotify: Floating, centered, and specific size
windowrule = float 1, class:^(spotify)$
windowrule = size 1200 200, class:^(spotify)$
windowrule = center 1, class:^(spotify)$

# Opacity rules
windowrule = opacity 0.80 0.70, class:^(thunar)$
windowrule = opacity 0.80 0.70, class:^(spotify)$



