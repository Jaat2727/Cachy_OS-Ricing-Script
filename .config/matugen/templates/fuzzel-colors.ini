[main]
font=monospace:size=14
dpi-aware=no
prompt="❯  "
icon-theme=AdwaitaLegacy
icons-enabled=yes
lines=8
width=55
horizontal-pad=20
vertical-pad=16
inner-pad=8
layer=overlay
exit-on-keyboard-focus-loss=yes
letter-spacing=0

[colors]
# Material Design dark theme colors — auto-generated by Matugen
background={{colors.surface.default.hex_stripped}}ee
text={{colors.on_surface.default.hex_stripped}}ff
prompt={{colors.primary.default.hex_stripped}}ff
input={{colors.on_surface.default.hex_stripped}}ff
match={{colors.primary.default.hex_stripped}}ff
selection={{colors.primary_container.default.hex_stripped}}ff
selection-text={{colors.on_primary_container.default.hex_stripped}}ff
selection-match={{colors.primary.default.hex_stripped}}ff
border={{colors.secondary_container.default.hex_stripped}}ff

[border]
width=2
radius=15

[key-bindings]
cancel=Escape Control+c
execute=Return
