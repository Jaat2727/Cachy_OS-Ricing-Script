[main]
font=monospace:size=14
dpi-aware=no
prompt="❯  "
icon-theme=AdwaitaLegacy
icons-enabled=yes
lines=8
width=55
horizontal-pad=20
vertical-pad=16
inner-pad=8
layer=overlay
exit-on-keyboard-focus-loss=yes
letter-spacing=0

[colors]
# Material Design dark theme colors (Matugen-generated)
# These are overwritten by matugen on wallpaper change
background=101510ee
text=dfe4dcff
prompt=96d5a6ff
input=dfe4dcff
match=96d5a6ff
selection=13512dff
selection-text=b2f1c0ff
selection-match=96d5a6ff
border=384b3cff

[border]
width=2
radius=15

[key-bindings]
cancel=Escape Control+c
execute=Return
